# je construis et publie les releases multi-plateformes de Toolé
# formats : deb, rpm (Linux) · dmg (macOS) · nsis/exe (Windows)
# secrets requis : TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
    branches: ["main"] # AJOUT : Déclenche aussi le script lors d'un push normal sur main pour mettre à jour la doc
  workflow_dispatch:

# AJOUT : Autorisations globales nécessaires pour publier sur GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-releases"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB AJOUTÉ : Génération et déploiement de la documentation technique Rust
  # =========================================================================

  # =========================================================================
  # JOB : Génération et déploiement de la documentation technique Rust
  # =========================================================================
  deploy-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: j'installe rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: je cache les builds rust (accélère les builds futurs)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop-app/src-tauri -> target"

      - name: je récupère les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xdg-utils libgtk-3-dev

      - name: je génère la documentation cargo
        # AJOUT : On se place directement dans le dossier src-tauri pour exécuter la commande
        working-directory: desktop-app/src-tauri
        run: cargo doc --no-deps --workspace

      - name: je crée le point d'entrée index.html pour GitHub Pages
        # AJOUT : On se place aussi ici dans le dossier src-tauri
        working-directory: desktop-app/src-tauri
        run: |
          # Sécurité : On crée le dossier s'il n'existe pas pour éviter l'erreur "No such file or directory"
          mkdir -p target/doc
          CRATE_NAME="app" 
          echo "<meta http-equiv=\"refresh\" content=\"0; url=${CRATE_NAME}/index.html\">" > target/doc/index.html

      - name: je configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: je téléverse l'artefact de la doc
        uses: actions/upload-pages-artifact@v3
        with:
          # Modifié : Le chemin est désormais plus court et précis
          path: "desktop-app/src-tauri/target/doc"

      - name: je déploie la doc sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  # VOS JOBS EXISTANTS (S'exécutent UNIQUEMENT s'il s'agit d'un Tag v*)
  # =========================================================================
  check-versions:
    if: startsWith(github.ref, 'refs/tags/v') # Sécurité : Ne s'exécute pas sur un simple push main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je vérifie que les versions concordent
        run: |
          PKG=$(node -p "require('./desktop-app/ui/package.json').version")
          CARGO=$(grep -m1 '^version' desktop-app/src-tauri/Cargo.toml | sed 's/.*= "\(.*\)"/\1/')
          TAURI=$(node -p "require('./desktop-app/src-tauri/tauri.conf.json').version")
          echo "package.json=$PKG Cargo.toml=$CARGO tauri.conf.json=$TAURI"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "::error::les versions ne concordent pas, le tag v__VERSION__ serait faux"
            exit 1
          fi

  build:
    if: startsWith(github.ref, 'refs/tags/v') # Sécurité : Ne s'exécute pas sur un simple push main
    needs: check-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,rpm
          - platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: je configure node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/ui/package-lock.json

      - name: j'installe rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: je cache les builds rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: j'installe le CLI Tauri (cargo tauri)
        run: cargo install tauri-cli --locked

      - name: je vérifie le CLI
        run: cargo tauri --version

      - name: j'installe les dépendances frontend
        working-directory: desktop-app/ui
        run: npm ci

      - name: je récupère les dépendances système Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xdg-utils libgtk-3-dev

      - name: je construit et je pousse vers la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/src-tauri
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: "Toolé v__VERSION__"
          releaseBody: |
            ## Toolé v__VERSION__

            Transfert de fichiers P2P sur réseau local, chiffré (QUIC/TLS 1.3).

            ### Téléchargements
            - **Linux** : `.deb` (Ubuntu/Debian), `.rpm` (Fedora) — tous deux servent aussi à la MAJ auto
            - **macOS** : `.dmg` universel (Intel + Apple Silicon) — build non notarié, Gatekeeper peut refuser :
            ```sh
            xattr -cr /Applications/Toolé.app
            ```
            La mise à jour automatique est désactivée sur macOS.
            - **Windows** : `-setup.exe`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: je publie aussi une archive portable Linux (.tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          APP_DIR="desktop-app/src-tauri/target/release/bundle/appimage"
          APP_IMG=$(ls "$APP_DIR"/*.AppImage | head -1)
          cd "$(dirname "$APP_IMG")"
          ARCHIVE="Toole-${VERSION}-linux-x86_64.tar.gz"
          if APPIMAGE_EXTRACT_AND_RUN=1 "./$(basename "$APP_IMG")" --appimage-extract >/dev/null 2>&1; then
            tar -czf "$ARCHIVE" squashfs-root
          else
            tar -czf "$ARCHIVE" "$(basename "$APP_IMG")"
          fi
          gh release upload "v${VERSION}" "$ARCHIVE" --clobber --repo "${{ github.repository }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v') # Sécurité : Ne s'exécute pas sur un simple push main
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je publie la release une fois les plateformes prêtes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
