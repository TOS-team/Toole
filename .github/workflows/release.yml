# je construis et publie les releases multi-plateformes de Toolé
# formats : deb, rpm (Linux) - dmg (macOS) - nsis/exe (Windows)
# secrets requis : TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-releases"
  cancel-in-progress: false

jobs:
  deploy-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: j'installe rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: je cache les builds rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: je recupere les dependances systeme Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils libgtk-3-dev

      - name: je genere la documentation cargo
        run: cargo doc --no-deps --workspace --exclude toole_tests

      - name: je liste le contenu genere
        run: ls -la target/doc/
      - name: je cree la page d'accueil de la doc
        run: |
          cat > target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <title>Documentation technique - Toole</title>
          <style>
            :root {
              --base: #1e1e2e;
              --mantle: #181825;
              --surface0: #313244;
              --surface1: #45475a;
              --text: #cdd6f4;
              --subtext: #a6adc8;
              --mauve: #cba6f7;
              --blue: #89b4fa;
              --green: #a6e3a1;
              --peach: #fab387;
            }
            * { box-sizing: border-box; }
            body {
              margin: 0;
              min-height: 100vh;
              background: radial-gradient(circle at top left, var(--mantle), var(--base));
              color: var(--text);
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
              display: flex;
              flex-direction: column;
              align-items: center;
              padding: 4rem 1.5rem;
            }
            header { text-align: center; margin-bottom: 3rem; max-width: 640px; }
            h1 {
              font-size: 2.2rem;
              margin-bottom: 0.5rem;
              background: linear-gradient(90deg, var(--mauve), var(--blue));
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
            }
            header p { color: var(--subtext); font-size: 1.05rem; line-height: 1.5; }
            .cards {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
              gap: 1.5rem;
              width: 100%;
              max-width: 760px;
            }
            .card {
              background: var(--surface0);
              border: 1px solid var(--surface1);
              border-radius: 14px;
              padding: 1.75rem;
              text-decoration: none;
              color: var(--text);
              transition: transform 0.15s ease, border-color 0.15s ease;
            }
            .card:hover {
              transform: translateY(-4px);
              border-color: var(--mauve);
            }
            .card .tag {
              display: inline-block;
              font-size: 0.75rem;
              text-transform: uppercase;
              letter-spacing: 0.05em;
              color: var(--base);
              background: var(--green);
              padding: 0.15rem 0.55rem;
              border-radius: 999px;
              margin-bottom: 0.75rem;
              font-weight: 600;
            }
            .card.app .tag { background: var(--peach); }
            .card h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
            .card p { margin: 0; color: var(--subtext); font-size: 0.92rem; line-height: 1.5; }
            footer {
              margin-top: 3rem;
              color: var(--subtext);
              font-size: 0.85rem;
              text-align: center;
            }
          </style>
          </head>
          <body>
            <header>
              <h1>Documentation technique</h1>
              <p>Reference API generee automatiquement depuis le code source Rust de Toole, transfert de fichiers pair-a-pair chiffre via QUIC.</p>
            </header>
            <div class="cards">
              <a class="card core" href="toole_core/index.html">
                <span class="tag">Core</span>
                <h2>toole_core</h2>
                <p>Protocole QUIC, decouverte des pairs sur le reseau local, chiffrement et logique de transfert de fichiers.</p>
              </a>
              <a class="card app" href="app_lib/index.html">
                <span class="tag">Tauri</span>
                <h2>app_lib</h2>
                <p>Commandes IPC et pont entre l'interface desktop et le coeur applicatif.</p>
              </a>
            </div>
            <footer>
              Genere automatiquement a chaque push sur main
            </footer>
          </body>
          </html>
          EOF
      - name: je configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: je televerse l'artefact de la doc
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: je deploie la doc sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  check-versions:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je verifie que les versions concordent
        run: |
          PKG=$(node -p "require('./desktop-app/ui/package.json').version")
          CARGO=$(grep -m1 '^version' desktop-app/src-tauri/Cargo.toml | sed 's/.*= "\(.*\)"/\1/')
          TAURI=$(node -p "require('./desktop-app/src-tauri/tauri.conf.json').version")
          echo "package.json=$PKG Cargo.toml=$CARGO tauri.conf.json=$TAURI"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "::error::les versions ne concordent pas"
            exit 1
          fi

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: --bundles deb,rpm
          - platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: je configure node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/ui/package-lock.json

      - name: j'installe rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: je cache les builds rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: j'installe le CLI Tauri
        run: cargo install tauri-cli --locked

      - name: je verifie le CLI
        run: cargo tauri --version

      - name: j'installe les dependances frontend
        working-directory: desktop-app/ui
        run: npm ci

      - name: je recupere les dependances systeme Linux
        if: matrix.platform == 'ubuntu-22.04'

        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils libgtk-3-dev

      - name: je construit et je pousse vers la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/src-tauri
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: "Toole v__VERSION__"
          releaseBody: >
            ## Toole v__VERSION__


            Transfert de fichiers P2P sur reseau local, chiffre (QUIC/TLS 1.3).


            ### Telechargements

            - Linux : .deb (Ubuntu/Debian), .rpm (Fedora), tous deux servent aussi a la MAJ auto

            - macOS : .dmg universel (Intel + Apple Silicon), build non notarie, Gatekeeper peut refuser, executez xattr -cr /Applications/Toole.app puis relancez. La mise a jour automatique est desactivee sur macOS.

            - Windows : -setup.exe
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}


      - name: je publie aussi une archive portable Linux
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          APP_DIR="desktop-app/src-tauri/target/release/bundle/appimage"
          APP_IMG=$(ls "$APP_DIR"/*.AppImage | head -1)
          cd "$(dirname "$APP_IMG")"
          ARCHIVE="Toole-${VERSION}-linux-x86_64.tar.gz"
          if APPIMAGE_EXTRACT_AND_RUN=1 "./$(basename "$APP_IMG")" --appimage-extract >/dev/null 2>&1; then
            tar -czf "$ARCHIVE" squashfs-root
          else
            tar -czf "$ARCHIVE" "$(basename "$APP_IMG")"
          fi
          gh release upload "v${VERSION}" "$ARCHIVE" --clobber --repo "${{ github.repository }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je publie la release une fois les plateformes pretes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
