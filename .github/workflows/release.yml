# je construis et publie les releases multi-plateformes de Toolé
# formats : deb, rpm, AppImage (Linux) · dmg (macOS) · msi, nsis/exe (Windows)
# secrets requis : TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je vérifie que les versions concordent
        run: |
          PKG=$(node -p "require('./desktop-app/ui/package.json').version")
          CARGO=$(grep -m1 '^version' desktop-app/src-tauri/Cargo.toml | sed 's/.*= "\(.*\)"/\1/')
          TAURI=$(node -p "require('./desktop-app/src-tauri/tauri.conf.json').version")
          echo "package.json=$PKG Cargo.toml=$CARGO tauri.conf.json=$TAURI"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "::error::les versions ne concordent pas, le tag v__VERSION__ serait faux"
            exit 1
          fi

  build:
    needs: check-versions
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: je configure node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/ui/package-lock.json

      - name: j'installe rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: je cache les builds rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: j'installe le CLI Tauri (cargo tauri)
        run: cargo install tauri-cli --locked

      - name: je vérifie le CLI
        run: cargo tauri --version

      - name: j'installe les dépendances frontend
        working-directory: desktop-app/ui
        run: npm ci

      - name: je récupère les dépendances système Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libgtk-3-dev

      - name: je pré-télécharge les outils AppImage (download réflexe du bundler)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p "$HOME/.cache/tauri"
          cd "$HOME/.cache/tauri"
          base=https://github.com/tauri-apps/binary-releases/releases/download
          raw=https://raw.githubusercontent.com/tauri-apps
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 -o AppRun-x86_64 "$base/apprun-old/AppRun-x86_64"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 -o linuxdeploy-x86_64.AppImage "$base/linuxdeploy/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 -o linuxdeploy-plugin-gtk.sh "$raw/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 -o linuxdeploy-plugin-gstreamer.sh "$raw/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh"
          curl -fL --retry 6 --retry-all-errors --retry-delay 2 -o linuxdeploy-plugin-appimage-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" || true
          chmod +x AppRun-x86_64 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gstreamer.sh linuxdeploy-plugin-appimage-x86_64.AppImage 2>/dev/null || true

      - name: je construit et je pousse vers la release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app/src-tauri
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: "Toolé v__VERSION__"
          releaseBody: |
            ## Toolé v__VERSION__

            Transfert de fichiers P2P sur réseau local, chiffré (QUIC/TLS 1.3).

            ### Téléchargements
            - **Linux** : `.deb` (Ubuntu/Debian), `.rpm` (Fedora), `.AppImage` (portable, sert à la MAJ auto), `.tar.gz` (archive portable extraite, sans FUSE)
            - **macOS** : `.dmg` universel (Intel + Apple Silicon) — build non notarié, Gatekeeper peut refuser :
            ```sh
            xattr -cr /Applications/Toolé.app
            ```
            La mise à jour automatique est désactivée sur macOS.
            - **Windows** : `-setup.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: je publie aussi une archive portable Linux (.tar.gz)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          APP_DIR="target/release/bundle/appimage"
          APP_IMG=$(ls "$APP_DIR"/*.AppImage | head -1)
          cd "$(dirname "$APP_IMG")"
          ARCHIVE="Toole-${VERSION}-linux-x86_64.tar.gz"
          if APPIMAGE_EXTRACT_AND_RUN=1 "./$(basename "$APP_IMG")" --appimage-extract >/dev/null 2>&1; then
            tar -czf "$ARCHIVE" squashfs-root
          else
            # extract impossible (fuse manquant) : j'archive l'AppImage telle quelle
            tar -czf "$ARCHIVE" "$(basename "$APP_IMG")"
          fi
          gh release upload "v${VERSION}" "$ARCHIVE" --clobber --repo "${{ github.repository }}"

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je publie la release une fois les plateformes prêtes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"

  # ───────────────────────────────────────────────
  # GÉNÉRATION DES CHECKSUMS + MISE À JOUR DISTANTS
  # ───────────────────────────────────────────────
  publish-checksums:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: je télécharge tous les assets de la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          mkdir -p dist
          cd dist
          gh release download "v${VERSION}" --repo "${{ github.repository }}"
          ls -la

      - name: je génère checksums.txt
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: j'upload checksums.txt sur la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          gh release upload "v${VERSION}" dist/checksums.txt --repo "${{ github.repository }}" --clobber

      - name: je calcule les hashes individuels pour Brew & AUR
        run: |
          cd dist
          echo "DMG_SHA=$(sha256sum *.dmg | awk '{print $1}')" >> $GITHUB_ENV
          echo "APPIMAGE_SHA=$(sha256sum *_amd64.AppImage | awk '{print $1}')" >> $GITHUB_ENV
          echo "DEB_SHA=$(sha256sum *_amd64.deb | awk '{print $1}')" >> $GITHUB_ENV

      # ─── Homebrew Tap ───
      - name: je mets à jour le Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/TOS-team/homebrew-toole.git" tap
          cd tap

          cat > Casks/toole.rb <<EOF
          cask "toole" do
            version "${VERSION}"
            sha256 "${DMG_SHA}"

            url "https://github.com/TOS-team/Toole/releases/download/v#{version}/toole_desktop_#{version}_x64.dmg"
            name "Toolé"
            desc "P2P file transfer on local network"
            homepage "https://github.com/TOS-team/Toole"

            app "Toolé.app"

            zap trash: [
              "~/Library/Application Support/Toolé",
              "~/Library/Caches/com.TiligreOpenSpace.Toole",
              "~/Library/Preferences/com.TiligreOpenSpace.Toole.plist",
              "~/Library/Saved Application State/com.TiligreOpenSpace.Toole.savedState",
            ]
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/toole.rb
          git commit -m "Update Toolé to v${VERSION} (sha256: ${DMG_SHA})"
          git push

      # ─── AUR ───
      - name: je mets à jour l'AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          VERSION=$(node -p "require('./desktop-app/ui/package.json').version")
          mkdir -p ~/.ssh
          echo "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking no
          EOF

          git clone ssh://aur@aur.archlinux.org/toole-bin.git aur
          cd aur

          cat > PKGBUILD <<EOF
          # Maintainer: TON_NOM <TON_EMAIL>
          pkgname=toole-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="P2P file transfer on local network"
          arch=('x86_64')
          url="https://github.com/TOS-team/Toole"
          license=('GPL3')
          depends=('webkit2gtk-4.1' 'gtk3' 'openssl')
          provides=('toole')
          conflicts=('toole')

          source=("https://github.com/TOS-team/Toole/releases/download/v${VERSION}/toole_desktop_${VERSION}_amd64.deb")
          sha256sums=('${DEB_SHA}')

          package() {
            tar -xf data.tar.xz -C "\${pkgdir}" 2>/dev/null || tar -xf data.tar.gz -C "\${pkgdir}"
          }
          EOF

          makepkg --printsrcinfo > .SRCINFO

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${VERSION} (sha256: ${DEB_SHA})"
          git push
