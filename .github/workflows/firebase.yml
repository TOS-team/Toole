# je déploie le site vitrine + le guide Docsify sur Firebase Hosting
# secrets requis : FIREBASE_SERVICE_ACCOUNT (contenu JSON du compte de service)
name: deploy-firebase

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: je déploie sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: toole-site