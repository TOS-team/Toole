[package]
name = "toole_core"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
directories = "5"
local-ip-address = "0.6"
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hostname = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
