[package]
name = "toole_tests"
version = "0.1.0"
edition = "2021"
publish = false

# je decris le but du crate : il regroupe tous les tests d'integration
# du projet Toolé (transfert, decouverte, utilitaires) en un seul endroit
# comment le lancer : cargo test -p toole_tests

[dependencies]
toole_core = { path = "../../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
